spring.application.name=pokedex

# Configura o endereço do servidor MySQL e seleciona o banco pokedex.
spring.datasource.url=jdbc:mysql://127.0.0.1:3306/pokedex

# Define o usuário utilizado para acessar o banco de dados.
spring.datasource.username=root

# Obtém a senha do banco de dados de uma variável de ambiente.
spring.datasource.password=${DB_PASSWORD}

# Informa ao Spring qual driver utilizar para se conectar ao MySQL.
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Impede que o Hibernate tente criar ou alterar tabelas automaticamente.
# Como a tabela pokemon já existe, vamos preservar sua estrutura.
spring.jpa.hibernate.ddl-auto=none

# Exibe no terminal os comandos SQL gerados pelo Hibernate.
# Por enquanto, deixamos desativado para evitar excesso de mensagens.
spring.jpa.show-sql=false

